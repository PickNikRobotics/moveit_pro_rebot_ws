<title>Leader-follower hardware and software connections</title>
<desc>A separate 12 volt supply powers the Star Arm leader. The leader uses USB serial to the host. The Desktop App sends Objectives to the MoveIt Pro Runtime, which sends RobStride commands through a SocketCAN adapter to the reBot follower.</desc>
