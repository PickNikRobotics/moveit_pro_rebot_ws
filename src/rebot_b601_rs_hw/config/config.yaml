based_on_package: rebot_b601_rs_sim
hardware:
  additional_driver_launch_file:
    package: rebot_b601_rs_hw
    path: launch/rebot_drivers.launch.py
  robot_description:
    urdf:
      package: rebot_b601_rs_hw
      path: description/rebot.urdf.xacro
    urdf_params:
    - hardware_interface: real
    - arm_control_mode: motion
    - arm_effort_command: 'true'
    - mujoco_model: ''
    - mujoco_model_package: ''
    - mujoco_keyframe: ''
    - mujoco_viewer: false
ros_global_params:
  use_sim_time: false
ros2_control:
  controllers_active_at_startup:
  - joint_state_broadcaster
  - joint_trajectory_admittance_controller
  - gravity_compensation_controller
objectives:
  behavior_loader_plugins:
    # This physical child inherits semantics, not simulation-only Behaviors.
    mujoco: []
    motion_recovery:
    - motion_recovery_behaviors::MotionRecoveryBehaviorsLoader
    rebot_hardware:
    - rebot_b601_rs_hw::RebotHardwareBehaviorsLoader
  objective_library_paths:
    # Replace the inherited simulation library with the physical library.
    rebot_sim_objectives:
      package_name: rebot_b601_rs_hw
      relative_path: objectives
    # Built HOME and Relax at HOME XML. It has no source package, so Runtime
    # startup links the built files, never the .xml.in templates. Read-only.
    rebot_hw_generated_objectives:
      package_name: rebot_b601_rs_hw_generated_objectives
      relative_path: objectives
    rebot_hw_objectives:
      package_name: rebot_b601_rs_hw
      relative_path: objectives
