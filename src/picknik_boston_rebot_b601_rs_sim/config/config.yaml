# Office-only twin overlay; the stock product chain remains unchanged.
based_on_package: "picknik_boston_rebot_b601_rs_hw"

hardware:
  robot_description:
    # The base description placed on the bench from config/bench_layout.yaml
    # and driven by MuJoCo; the SRDF is inherited.
    urdf:
      package: "picknik_boston_rebot_b601_rs_sim"
      path: "description/rebot_bench.urdf.xacro"
    urdf_params:
      - hardware_interface: "mujoco"
      - boston_gravity_fit: false
      - arm_effort_command: false
      - mujoco_model_package: "picknik_boston_rebot_b601_rs_sim"
      - mujoco_model: "description/scene.xml"
      - mujoco_keyframe: "default"
      - mujoco_viewer: false
  # MuJoCo renders both cameras; no camera drivers start.
  additional_driver_launch_file:
    package: "picknik_boston_rebot_b601_rs_sim"
    path: "launch/sim_drivers.launch.py"

ros_global_params:
  # MuJoCo's installed control loop uses wall time, not /clock.
  use_sim_time: false
  # The source twin's leader remains optional; simulation never opens USB by default.
  rebot_leader_enabled: false

objectives:
  behavior_loader_plugins:
    # Add one loader group; leave the inherited core/recovery/office groups intact.
    mujoco:
      - "moveit_pro::behaviors::MujocoBehaviorsLoader"
  objective_library_paths:
    mujoco_objectives:
      package_name: "moveit_pro_objectives"
      relative_path: "objectives/mujoco"
    # Last, so Objectives created in the UI are saved in this package.
    boston_sim_objectives:
      package_name: "picknik_boston_rebot_b601_rs_sim"
      relative_path: "objectives"

ros2_control:
  # Gravity is provided by the physics model, never the fitted hardware controller.
  controllers_active_at_startup:
    - joint_state_broadcaster
    - joint_trajectory_admittance_controller
  controllers_not_managed:
    - sim_grasp_proxy_controller
